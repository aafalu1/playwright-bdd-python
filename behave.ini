[behave]
format = pretty
show_timings = true
logging_level = INFO

[behave.formatters]
html-pretty = behave_html_pretty_formatter:PrettyHTMLFormatter
html = behave_html_formatter:HTMLFormatter

[behave.userdata]
behave.formatter.html-pretty.title_string = Playwright Test Automation Report
behave.formatter.html-pretty.icon = assets/company_logo.svg
behave.formatter.html-pretty.pseudo_steps = false
behave.formatter.html-pretty.pretty_output = true
behave.formatter.html-pretty.date_format = %%Y-%%m-%%d %%H:%%M:%%S
behave.formatter.html-pretty.show_summary = true
behave.formatter.html-pretty.show_unexecuted_steps = true
behave.formatter.html-pretty.collapse = auto
behave.formatter.html-pretty.show_retry_attempts = true
behave.formatter.html-pretty.global_summary = true
behave.additional-info.framework = Playwright + Behave
behave.additional-info.runner = BDD Test Runner
