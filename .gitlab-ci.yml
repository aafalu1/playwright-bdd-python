# ==============================================================================
# GitLab CI/CD Pipeline for Playwright Behave Test Automation
# ==============================================================================

stages:
  - test
  - report

# Global defaults (Inherited by all jobs unless overridden)
default:
  image: registry.gitlab.com/aafalu/behave-playwright-docker-image:latest

variables:
  # Framework configuration matching config/settings.py (APP_ prefix)
  APP_ENV: "ci"
  APP_BASE_URL: "https://staging.example.com"
  APP_BROWSER: "chromium"
  APP_HEADLESS: "true"
  APP_TIMEOUT_MS: "15000"
  APP_SLOW_MO_MS: "0"
  APP_VIEWPORT_WIDTH: "1280"
  APP_VIEWPORT_HEIGHT: "720"
  APP_TRACE_ON_FAILURE: "true"
  APP_SCREENSHOT_ON_FAILURE: "true"
  APP_REPORTS_DIR: "reports"
  APP_LOG_LEVEL: "INFO"

before_script:
  # 1. Automatic pip upgrade on the runner machine
  - python3 -m pip install --upgrade pip
  # 2. Always install and upgrade to the latest dependencies from requirements.txt
  - |
    if command -v behave >/dev/null 2>&1; then
      echo "✓ Pre-baked runner image detected. Syncing latest dependencies from requirements.txt..."
      pip install --upgrade -r requirements.txt
    else
      echo "Generic base image detected. Setting up virtualenv..."
      python3 -m venv .venv
      source .venv/bin/activate
      python3 -m pip install --upgrade pip
      pip install --upgrade -r requirements.txt
    fi

# ------------------------------------------------------------------------------
# Test Jobs (Chromium Browser Engine Only)
# ------------------------------------------------------------------------------

# 1. Staging Test Run (Default for MRs and main branch)
test:staging:
  stage: test
  variables:
    APP_BASE_URL: "https://staging.example.com"
    APP_BROWSER: "chromium"
  script:
    - "[ -f .venv/bin/activate ] && source .venv/bin/activate || true"
    - behave -f html-pretty -o reports/report.html -f pretty
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/
    reports:
      junit: reports/junit.xml # Optional if using junit formatter

# 2. Scheduled Regression Suite (Chromium Only - No Firefox or WebKit)
test:scheduled-regression:
  stage: test
  variables:
    APP_BROWSER: "chromium"
  script:
    - "[ -f .venv/bin/activate ] && source .venv/bin/activate || true"
    - behave -f html-pretty -o reports/regression_report.html -f pretty
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# 3. Production Smoke Test (Manual trigger or specific tags)
test:production:
  stage: test
  variables:
    APP_ENV: "prod"
    APP_BASE_URL: "https://example.com"
    APP_LOG_LEVEL: "WARNING"
  script:
    - "[ -f .venv/bin/activate ] && source .venv/bin/activate || true"
    - behave --tags=@smoke -f html-pretty -o reports/prod_smoke_report.html -f pretty
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
