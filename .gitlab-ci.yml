# ==============================================================================
# GitLab CI/CD Pipeline for Playwright + Behave Automation
# ==============================================================================

stages:
  - validate
  - test

default:
  image: registry.gitlab.com/aafalu/behave-playwright-docker-image:latest
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  APP_ENV: "ci"
  APP_BASE_URL: "https://staging.example.com"
  APP_BROWSER: "chromium"
  APP_HEADLESS: "true"
  APP_TIMEOUT_MS: "15000"
  APP_SLOW_MO_MS: "0"
  APP_VIEWPORT_WIDTH: "1280"
  APP_VIEWPORT_HEIGHT: "720"
  APP_TRACE_ON_FAILURE: "true"
  APP_SCREENSHOT_ON_FAILURE: "true"
  APP_LOG_LEVEL: "INFO"

# ------------------------------------------------------------------------------
# Validate Gherkin Syntax and Step Definitions
# ------------------------------------------------------------------------------

validate:dry-run:
  stage: validate
  script:
    - echo "Validating feature files and step definitions..."
    - behave --dry-run -f pretty
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ------------------------------------------------------------------------------
# Staging Test Execution
# ------------------------------------------------------------------------------

test:staging:
  stage: test
  variables:
    APP_ENV: "staging"
    APP_BASE_URL: "https://staging.example.com"
  script:
    - mkdir -p reports/junit
    - behave \
        -f pretty \
        -f html-pretty -o reports/staging-report.html \
        -f junit -o reports/junit
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/
    reports:
      junit:
        - reports/junit/*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'

# ------------------------------------------------------------------------------
# Scheduled Regression Suite
# ------------------------------------------------------------------------------

test:scheduled-regression:
  stage: test
  variables:
    APP_ENV: "staging"
    APP_BASE_URL: "https://staging.example.com"
  script:
    - mkdir -p reports/junit
    - behave \
        -f pretty \
        -f html-pretty -o reports/regression-report.html \
        -f junit -o reports/junit
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/
    reports:
      junit:
        - reports/junit/*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ------------------------------------------------------------------------------
# Production Smoke Tests
# ------------------------------------------------------------------------------

test:production:
  stage: test
  variables:
    APP_ENV: "prod"
    APP_BASE_URL: "https://example.com"
    APP_LOG_LEVEL: "WARNING"
  script:
    - mkdir -p reports/junit
    - behave \
        --tags=@smoke \
        -f pretty \
        -f html-pretty -o reports/prod-smoke-report.html \
        -f junit -o reports/junit
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
    reports:
      junit:
        - reports/junit/*.xml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false