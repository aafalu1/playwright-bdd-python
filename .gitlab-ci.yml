# ==============================================================================
# GitLab CI/CD Pipeline for Playwright Behave Test Automation
# ==============================================================================

stages:
  - validate   # 👈 Instant ~1 second quality gate
  - test       # 👈 Heavy browser tests only execute if validation passes
  - report

# Global defaults: Your custom pre-baked image
default:
  image: registry.gitlab.com/aafalu/behave-playwright-docker-image:latest

variables:
  APP_ENV: "ci"
  APP_BASE_URL: "https://staging.example.com"
  APP_BROWSER: "chromium"
  APP_HEADLESS: "true"
  APP_TIMEOUT_MS: "15000"
  APP_SLOW_MO_MS: "0"
  APP_VIEWPORT_WIDTH: "1280"
  APP_VIEWPORT_HEIGHT: "720"
  APP_TRACE_ON_FAILURE: "true"
  APP_SCREENSHOT_ON_FAILURE: "true"
  APP_REPORTS_DIR: "reports"
  APP_LOG_LEVEL: "INFO"
  # default Behave tags to run (can be overridden in specific jobs or GitLab UI)
  BEHAVE_TAGS: "@smoke"


# ------------------------------------------------------------------------------
# 1. Quality Gate: Dry-Run Validation (~1 second - No browsers launched)
# ------------------------------------------------------------------------------
validate:dry-run:
  stage: validate
  script:
    - echo "🔍 Validating Gherkin syntax, step mappings, duplicate steps, and missing step definitions..."
    - behave --dry-run -f pretty
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ------------------------------------------------------------------------------
# 2. Test Jobs (Chromium Browser Engine - Only runs if validate passes)
# ------------------------------------------------------------------------------

# 1. Staging Test Run
test:staging:
  stage: test
  variables:
    APP_BASE_URL: "https://staging.example.com"
    APP_BROWSER: "chromium"
  script:
    - behave --tags="$BEHAVE_TAGS" -f html-pretty -o reports/report.html -f pretty
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/

# 2. Scheduled Regression Suite
test:scheduled-regression:
  stage: test
  variables:
    APP_BROWSER: "chromium"
    BEHAVE_TAGS: "@regression"
  script:
    - behave --tags="$BEHAVE_TAGS" -f html-pretty -o reports/regression_report.html -f pretty
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# 3. Production Smoke Test
test:production:
  stage: test
  variables:
    APP_ENV: "prod"
    APP_BASE_URL: "https://example.com"
    APP_LOG_LEVEL: "WARNING"
  script:
    - behave --tags="$BEHAVE_TAGS" -f html-pretty -o reports/prod_smoke_report.html -f pretty
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual